<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Student Support Status</title>
</head>
<body>
    <main class="support_status" id="tables-container">
        <!-- Back Button Added Here -->
            <button type="button" onclick="window.location.href='Student Dashboard.php'" class="backbutton">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>

        <div id="status-message" style="text-align: center;">Loading requests...</div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const statusFilter = urlParams.get('status') || 'Pending';
            const container = document.getElementById("tables-container");
            const statusMessage = document.getElementById("status-message");

            fetch(`Student%20Support%20Status.php?status=${encodeURIComponent(statusFilter)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Unauthorized or server error");
                    return response.json();
                })
                .then(data => {
                    if (statusMessage) statusMessage.remove(); 

                    if (data.length === 0) {
                        const noDataMsg = document.createElement("div");
                        noDataMsg.style.textAlign = "center";
                        noDataMsg.innerHTML = `No support requests found (${escapeHtml(statusFilter)}).`;
                        container.appendChild(noDataMsg);
                        return;
                    }

                    data.forEach(request => {
                        const table = document.createElement("table");
                        table.className = "support_status_table";
                        
                        table.innerHTML = `
                            <tbody>
                                <tr>
                                    <th>Selected Volunteer</th>
                                    <td>${escapeHtml(request.volunteerName)}</td>
                                </tr>
                                <tr>
                                    <th>Preferred Skills</th>
                                    <td>${escapeHtml(request.preferredSkills)}</td>
                                </tr>
                                <tr>
                                    <th>Preferred Date</th>
                                    <td>${escapeHtml(request.preferredDate)}</td>
                                </tr>
                                <tr>
                                    <th>Preferred Time</th>
                                    <td>${escapeHtml(request.preferredTime)}</td>
                                </tr>
                                <tr>
                                    <th>Support Mode</th>
                                    <td>${escapeHtml(request.supportMode)}</td>
                                </tr>
                                <tr>
                                    <th>Status</th>
                                    <td>
                                        <span class="status-badge ${escapeHtml(request.requestStatus.toLowerCase())}">
                                            <i class="fa-solid fa-circle-info"></i> ${escapeHtml(request.requestStatus)}
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        `;
                        container.appendChild(table);
                    });
                })
                .catch(error => {
                    if (statusMessage) {
                        statusMessage.style.color = "red";
                        statusMessage.innerText = `Error: ${error.message}`;
                    }
                });
        });

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
