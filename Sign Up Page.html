<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Sign Up</title>
</head>
<body>
    <main class="signup">
        <form class="signupform" id="signupform" action="Sign Up Page.php" method="post">
            <h1>Sign Up</h1>
            <label for="name">Username</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="studentID">Student ID:</label>
            <input type="text" id="studentID" name="studentID">
            <label for="phone">Enter your phone number:</label>
            <input  type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{7}|[0-9]{3}-[0-9]{8}" placeholder="012-12345678" required>
            <label for="password">Password:</label>
            <div class="password-container">
                <input type="password" id="password" name="password" required>
                <i class="fa-regular fa-eye" id="togglePassword"onclick="showPassword()"></i>
            </div>
            <div class="confirm_cancelbtn">
                <button type="submit">Confirm</button>
                <button type="button" onclick="window.location.href='Login Page.html';">Cancel</button>
            </div>
        </form>
    </main>

    <script>   
        document.getElementById('loginform').addEventListener('submit', function(event) {
            event.preventDefault();
            window.location.href = 'Choose Role.html'; 
        });

        function showPassword() {
            const password = document.getElementById("password");
            const toggleIcon = document.getElementById("togglePassword");

            if (password.type === "password") {
                // Show password
                password.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                // Hide password
                password.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
